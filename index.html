<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sea of Poppies Project</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .map-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            box-sizing: border-box;
            overflow: hidden;
        }
        iframe {
            min-width: 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="map-wrapper">
        <iframe
            src="https://storymaps.arcgis.com/stories/3162d083388a40cc811a63644d92818c"
            title="Sea of Poppies map"
            allowfullscreen
            allow="fullscreen; geolocation"
            scrolling="no"></iframe>
    </div>

</body>
</html>
